name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 ruff==0.16.3
      - run: ruff check code scripts
      - run: pytest
      - run: python scripts/lint_pages.py --final docs
      - run: mkdocs build --strict
