site_name: HLD + LLD Interview Handbook
site_description: System design (HLD) and low-level design (LLD) interview handbook for SDE2 candidates, with tested Python implementations and Mermaid diagrams.
site_author: param087
site_url: https://hld-lld-interview-handbook.vercel.app/
repo_url: https://github.com/param087/hld-lld-interview-handbook
repo_name: param087/hld-lld-interview-handbook
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 param087 &middot; MIT License

docs_dir: docs
site_dir: site
use_directory_urls: true

exclude_docs: |
  _templates/

watch:
  - code

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/book-open-page-variant
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir
      check_paths: true
      dedent_subsections: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys

plugins:
  - search
  - glightbox:
      touchNavigation: true
      zoomable: true
      auto_caption: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/param087
      name: param087 on GitHub

